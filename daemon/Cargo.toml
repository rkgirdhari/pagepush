[package]
name = "page-push-daemon"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Optional local Axum/Tower-HTTP daemon for the Page Push browser extension. Generates Facebook Page copy offline, with an optional local Candle Qwen3 GGUF backend."

[[bin]]
name = "page-push-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.7.9", features = ["json", "macros"] }
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
hyper-util = "=0.1.10"
indexmap = "=2.6.0"

# Optional local LLM backend. Enable with `cargo run --features qwen3-gguf`
# and point HCC_QWEN3_GGUF / HCC_QWEN3_TOKENIZER at local model files.
candle-core = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "=0.20.4", default-features = false, features = ["onig"], optional = true }

[features]
default = []
qwen3-gguf = ["candle-core", "candle-transformers", "tokenizers"]
