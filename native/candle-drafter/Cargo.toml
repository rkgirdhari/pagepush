[package]
name = "candle-drafter"
version = "0.1.0"
edition = "2021"
publish = false
description = "CPU Candle runner for the pinned Qwen3-0.6B Q8_0 GGUF."

[dependencies]
anyhow = "1"
candle = { package = "candle-core", version = "0.11" }
candle-transformers = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = false
codegen-units = 1
